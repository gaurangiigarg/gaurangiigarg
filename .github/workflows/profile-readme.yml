name: Update Profile Pencil

on:
  schedule:
    - cron: "0 */12 * * *"   # runs twice a day
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  pencil:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate pencil animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: gaurangiigarg
          OUT_PATH: dist/pencil-contribution.svg
        run: |
          mkdir -p dist
          python scripts/generate_pencil_svg.py

      - name: Push SVG to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
